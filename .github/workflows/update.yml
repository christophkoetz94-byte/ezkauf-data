name: Auto-Sync Kölner Angebote

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright und Tools installieren
        run: |
          pip install playwright requests beautifulsoup4
          playwright install chromium --with-deps

      - name: Kölner Angebote mit Real-Browser scrapen
        run: python fetch_offers.py

      - name: Neue Angebote speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/angebote_koeln.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update: Kölner Angebote (Playwright)" && git push)
